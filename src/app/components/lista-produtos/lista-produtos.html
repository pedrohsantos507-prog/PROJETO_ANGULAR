<div id="div-form">
    <h2>Lista de Produtos</h2>

    <form id="formulario">
        <label for="descricao">Descrição</label>
        <input type="text" name="descricao" id="descricao" [(ngMode)] = "descricao_produto">

        <label for="valor_unitario">Valor unitario</label>
        <input type="number" name="valor_unitario" id="valor_unitario" [(ngMode)] = valor_unitario>

        <div id="div-btns">
            <button type="button" id="btnAdd" (click) = "addItem()">Adicionar</button>
            <button type="button" id="btnLimpar">Limpar</button>
        </div>
    </form>
    <div id="div-lista">
        <div class="div-item"> 1 - Pão - 3,50</div>
        <div class="div-item"> 2 - Manteiga - 16,00</div>
        <div class="div-item"> 3 - café - 12,00</div>
    </div>
</div>
