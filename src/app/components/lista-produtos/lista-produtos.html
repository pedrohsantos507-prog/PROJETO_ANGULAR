<div id="div-form">
  <h2>Cadastro de Produtos</h2>

  <form id="formulario">
    <label for="produto">Produto</label>
    <input
      type="text"
      name="produto"
      id="produto"
      placeholder="Nome do Produto"
      [(ngModel)]="nomeProduto"
    />

    <label for="preco">Preço</label>
    <input
      type="number"
      name="preco"
      id="preco"
      placeholder="0,00"
      [(ngModel)]="precoProduto"
    />

    <div id="div-btns">
      <button type="button" id="btnAdd" (click)="addProduto()">
        Adicionar
      </button>

      <button type="button" id="btnLimpar" (click)="limparTudo()">
        Limpar
      </button>
    </div>
  </form>

  <div id="div-lista">
    @for (produto of listaProdutos; track produto.idProduto) {
      <div
        class="div-item"
        [class.selecionado]="produto.selecionado"
        (click)="selecionarProduto(produto)"
      >
        <input type="checkbox" [checked]="produto.selecionado" />

        &nbsp;

        {{ produto.idProduto }} - {{ produto.nomeProduto }} - R$
        {{ produto.precoProduto }}
      </div>
    } @empty {
      <div class="div-item">NENHUM PRODUTO CADASTRADO</div>
    }
  </div>
</div>
